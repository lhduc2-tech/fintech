<!doctype html>
<html>
<body style="margin:0;background:#f6f8fb;font-family:Arial,sans-serif;color:#172033;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
    <div style="background:#ffffff;border:1px solid #e6eaf0;border-radius:8px;padding:28px;">
      <h1 style="font-size:22px;margin:0 0 12px;">Xác thực email</h1>
      <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Xin chào {{fullName}}, đây là mã OTP để xác thực email đăng ký tài khoản Fintech của bạn.</p>
      <div style="display:inline-block;background:#eef4ff;color:#0f3f8c;border:1px solid #c8dafc;border-radius:6px;padding:12px 18px;font-size:24px;font-weight:bold;letter-spacing:4px;">{{verificationCode}}</div>
      <p style="font-size:13px;line-height:1.6;color:#5f6b7a;margin:22px 0 0;">Vui lòng nhập mã này ở màn hình đăng ký. Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email.</p>
    </div>
  </div>
</body>
</html>
