<!doctype html>
<html>
<body style="margin:0;background:#f6f8fb;font-family:Arial,sans-serif;color:#172033;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
    <div style="background:#ffffff;border:1px solid #e6eaf0;border-radius:8px;padding:28px;">
      <h1 style="font-size:22px;margin:0 0 12px;">Xác nhận tạo mã PIN</h1>
      <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Xin chào {{fullName}}, đây là mã OTP để xác nhận tạo mã PIN bảo mật giao dịch của bạn trên Fintech.</p>
      <div style="display:inline-block;background:#fff4e5;color:#92400e;border:1px solid #fcd34d;border-radius:6px;padding:12px 18px;font-size:24px;font-weight:bold;letter-spacing:4px;">{{pinOtpCode}}</div>
      <p style="font-size:13px;line-height:1.6;color:#5f6b7a;margin:22px 0 0;">Mã có hiệu lực trong <strong>5 phút</strong>. Vui lòng nhập mã này để hoàn tất việc tạo mã PIN. Nếu bạn không thực hiện yêu cầu này, hãy bỏ qua email này.</p>
    </div>
  </div>
</body>
</html>
