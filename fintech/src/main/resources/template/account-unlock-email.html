<!doctype html>
<html>
<body style="margin:0;background:#f6f8fb;font-family:Arial,sans-serif;color:#172033;">
  <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
    <div style="background:#ffffff;border:1px solid #e6eaf0;border-radius:8px;padding:28px;">
      <h1 style="font-size:22px;margin:0 0 12px;">Mã mở khóa tài khoản</h1>
      <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Xin chào {{fullName}}, tài khoản Fintech của bạn đã bị tạm khóa do nhập sai mật khẩu quá số lần cho phép.</p>
      <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Vui lòng nhập đúng mật khẩu cùng mã xác thực bên dưới để mở khóa tài khoản.</p>
      <div style="font-size:28px;letter-spacing:6px;font-weight:bold;background:#eef4ff;color:#1565d8;padding:14px 18px;border-radius:6px;text-align:center;">{{unlockCode}}</div>
      <p style="font-size:13px;line-height:1.6;color:#5f6b7a;margin:22px 0 0;">Nếu bạn không thực hiện yêu cầu này, vui lòng bỏ qua email.</p>
    </div>
  </div>
</body>
</html>
