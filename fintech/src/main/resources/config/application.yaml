logging:
  level:
    org:
      springframework:
        web:
          servlet:
            mvc:
              method:
                annotation:
                  RequestMappingHandlerMapping: DEBUG
    zaxxer:
      hikari:
        HikariConfig: DEBUG
    com:
      university:
        fintech: DEBUG
        # Bật DEBUG để thấy [ENCRYPTION CHECK] log trong KafkaWalletTransactionProcessor
        # Sau khi verify xong có thể đổi về INFO hoặc xóa dòng này

spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Kích hoạt profile "local" để dùng được DevTestOperator endpoint
    # Xóa dòng này trước khi deploy lên production
    active: local
  main:
    allow-bean-definition-overriding: true
  application:
    name: fintech-service
  threads:
    virtual:
      enabled: true
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    redis:
      url: ${REDIS_REST_URL:}
      token: ${REDIS_REST_TOKEN:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_SASL_USERNAME:}\" password=\"${KAFKA_SASL_PASSWORD:}\";"
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_CA_CERT_PATH:kafka-ca.pem}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: fintech-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:}
    access-key-id: ${S3_KEY_ID:}
    secret-access-key: ${S3_ACCESS_KEY:}
    bucket-name: ${S3_BUCKET_NAME:}
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      pool-name: Hikari
      maximum-pool-size: 40
      data-source-properties:
        oracle:
          jdbc:
            defaultConnectionValidation: LOCAL
      minimum-idle: 10
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        generate_statistics: false
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
        show_sql: true
        format_sql: true
application:
  version: api/v1
  path:
    base:
      private: /private/${application.version}
      public: /public/${application.version}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:}
  kafka:
    enabled: true
    payment-request-topic: payment.request
    payment-result-topic: payment.result
    payload-secret-key: ${KAFKA_PAYLOAD_SECRET_KEY:}
  auth:
    email-verification-ttl-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:86400}
    email-verification-send-max-attempts: ${EMAIL_VERIFICATION_SEND_MAX_ATTEMPTS:3}
    email-verification-send-window-seconds: ${EMAIL_VERIFICATION_SEND_WINDOW_SECONDS:600}
    email-verification-send-cooldown-seconds: ${EMAIL_VERIFICATION_SEND_COOLDOWN_SECONDS:60}
    account-unlock-code-ttl-seconds: ${ACCOUNT_UNLOCK_CODE_TTL_SECONDS:600}
    password-reset-code-ttl-seconds: ${PASSWORD_RESET_CODE_TTL_SECONDS:600}
  wallet:
    # Thời gian tối đa (phút) một giao dịch được phép ở trạng thái PENDING
    # trước khi bị Scheduled Job đánh dấu là TIMED_OUT và hoàn tiền hold
    pending-timeout-minutes: ${WALLET_PENDING_TIMEOUT_MINUTES:5}
    # Tần suất Scheduled Job kiểm tra (ms). Mặc định: 5 phút
    timeout-check-interval-ms: ${WALLET_TIMEOUT_CHECK_INTERVAL_MS:360000}
    # TTL (giây) của OTP xác nhận tạo mã PIN (mặc định: 300s = 5 phút)
    pin-otp-ttl-seconds: ${WALLET_PIN_OTP_TTL_SECONDS:300}
    # TTL (giây) của PIN hash tạm chờ xác nhận (mặc định: 300s = 5 phút)
    pin-pending-ttl-seconds: ${WALLET_PIN_PENDING_TTL_SECONDS:300}
    # TTL (giây) của OTP xác thực giao dịch khi chưa có PIN (mặc định: 300s = 5 phút)
    tx-otp-ttl-seconds: ${WALLET_TX_OTP_TTL_SECONDS:300}
    # Số lần nhập PIN sai tối đa trước khi bị khóa (mặc định: 5 lần)
    pin-max-failed-attempts: ${WALLET_PIN_MAX_FAILED_ATTEMPTS:5}
  faceid:
    # URL của FaceID Python server (nội bộ Docker network)
    server-url: ${FACEID_SERVER_URL:http://13.213.32.9:5001}
    # Ngưỡng giá trị giao dịch bắt buộc FaceID (VNĐ) — chuẩn QĐ 2345/QĐ-NHNN
    high-value-threshold: ${FACEID_HIGH_VALUE_THRESHOLD:10000000}
    # Tắt/mở FaceID (dùng khi test local không có Python server)
    enabled: ${FACEID_ENABLED:true}
  fraud-detection:
    # URL của Fraud Detection Python server (cổng 5002)
    server-url: ${FRAUD_DETECTION_SERVER_URL:http://localhost:5002}
    # Bật/tắt gọi Fraud Detection
    enabled: ${FRAUD_DETECTION_ENABLED:true}
    # Timeout gọi sàng lọc gian lận (giây)
    timeout-seconds: ${FRAUD_DETECTION_TIMEOUT_SECONDS:5}


server:
  port: 8082
  servlet:
    context-path: ${SERVER_CTX_PATH:}

proxy:
  enable: false
  host: localhost
  port: 8082

