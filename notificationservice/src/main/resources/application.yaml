logging:
  level:
    com:
      university:
        notificationservice: DEBUG

spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true
  application:
    name: notificationservice
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_SASL_USERNAME:}\" password=\"${KAFKA_SASL_PASSWORD:}\";"
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_CA_CERT_PATH:kafka-ca.pem}
    consumer:
      group-id: notificationservice-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
            protocols: TLSv1.2

application:
  kafka:
    payment-mail-topic: payment.mail
    payload-secret-key: ${KAFKA_PAYLOAD_SECRET_KEY:}
  mail:
    from: ${SPRING_MAIL_USERNAME:}

server:
  port: 8088
