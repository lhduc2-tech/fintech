<!doctype html>
<html>
<body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#172033;">
  <div style="max-width:600px;margin:0 auto;padding:32px 20px;">
    <div style="background:#7f1d1d;border-radius:8px 8px 0 0;padding:22px 28px;color:#ffffff;">
      <div style="font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#fecaca;">Fintech Wallet</div>
      <h1 style="font-size:24px;line-height:1.3;margin:8px 0 0;">Giao dịch không thành công</h1>
    </div>

    <div style="background:#ffffff;border:1px solid #f1d5d5;border-top:0;border-radius:0 0 8px 8px;padding:28px;">
      <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">Xin chào <strong>{{fullName}}</strong>, yêu cầu giao dịch ví của bạn chưa thể hoàn tất.</p>

      <div style="border:1px solid #f3d1d1;border-radius:8px;padding:20px;margin:0 0 22px;background:#fff8f8;">
        <div style="font-size:13px;color:#8a4b4b;margin:0 0 6px;">Số tiền yêu cầu</div>
        <div style="font-size:30px;line-height:1.2;font-weight:bold;color:#7f1d1d;margin:0 0 14px;">{{amount}}</div>
        <span style="display:inline-block;background:#fee2e2;color:#991b1b;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:bold;letter-spacing:.4px;">FAILED</span>
      </div>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;">
        <tr>
          <td style="padding:12px 0;border-bottom:1px solid #f1e4e4;color:#8a4b4b;width:38%;">Loại giao dịch</td>
          <td style="padding:12px 0;border-bottom:1px solid #f1e4e4;text-align:right;font-weight:bold;color:#172033;">{{transactionType}}</td>
        </tr>
        <tr>
          <td style="padding:12px 0;color:#8a4b4b;">Lý do</td>
          <td style="padding:12px 0;text-align:right;color:#172033;">{{errorMessage}}</td>
        </tr>
      </table>

      <p style="font-size:13px;line-height:1.6;color:#62748a;margin:24px 0 0;">Bạn có thể kiểm tra lại số dư, thông tin ngân hàng hoặc thử lại sau ít phút.</p>
    </div>
  </div>
</body>
</html>
