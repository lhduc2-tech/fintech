logging:
  level:
    com:
      university:
        paymentgateway: DEBUG

spring:
  config:
    import: optional:file:.env[.properties]
  main:
    allow-bean-definition-overriding: true
  application:
    name: paymentgateway-service
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"${KAFKA_SASL_USERNAME:}\" password=\"${KAFKA_SASL_PASSWORD:}\";"
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_CA_CERT_PATH:kafka-ca.pem}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: paymentgateway-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

application:
  kafka:
    payment-request-topic: payment.request
    payload-secret-key: ${KAFKA_PAYLOAD_SECRET_KEY:}
  coreservice:
    url: ${CORE_SERVICE_URL:http://localhost:8086}

server:
  port: 8084
  servlet:
    context-path: ${SERVER_CTX_PATH:}

