events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Increase buffer sizes for Spring Boot responses
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    server {
        listen 80;
        server_name _;

        # Root Health check
        location = / {
            return 200 '{"status":"UP","service":"Fintech & FaceID API Gateway"}';
            add_header Content-Type application/json;
        }

        # 1. Fintech Service (context path: /fintech-service)
        # Giu nguyen toan bo path: /fintech-service/public/api/... -> backend nhan dung /fintech-service/public/api/...
        location /fintech-service/ {
            proxy_pass http://fintech-service:8082/fintech-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 2. Payment Gateway Service (context path: /paymentgateway-service)
        location /paymentgateway-service/ {
            proxy_pass http://paymentgateway:8080/paymentgateway-service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 3. Core Service
        location /coreservice/ {
            proxy_pass http://coreservice:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 4. FaceID eKYC Web UI & Static files
        location /faceid/ {
            proxy_pass http://faceid-service:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 5. FaceID API routes
        location /api/ {
            proxy_pass http://faceid-service:5001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Health endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
