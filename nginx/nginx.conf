events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Allow large payloads (Base64-encoded face images for eKYC)
    client_max_body_size 50m;

    # Increase proxy buffer sizes for large responses
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    keepalive_timeout  65;

    # 1. Tự động chuyển toàn bộ HTTP (Port 80) sang HTTPS (Port 443)
    server {
        listen 80;
        server_name api.fintech-seggs.xyz fintech-seggs.xyz;
        return 301 https://$host$request_uri;
    }

    # 2. Cấu hình HTTPS Bảo Mật (Port 443) - Gateway Trung Tâm
    server {
        listen 443 ssl;
        server_name api.fintech-seggs.xyz fintech-seggs.xyz;

        # Chứng chỉ SSL Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/api.fintech-seggs.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fintech-seggs.xyz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50M;

        # ─── FINTECH BACKEND SERVICES (Nội bộ Server 1) ───────────────────────
        
        # 1. Fintech Service
        location /fintech-service/ {
            proxy_pass http://fintech-service:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Payment Gateway
        location /paymentgateway-service/ {
            proxy_pass http://paymentgateway:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Core Service
        location /coreservice/ {
            proxy_pass http://coreservice:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ─── AI SERVICES (Chuyển tiếp sang Server 2: 47.129.142.105) ──────────

        # 4. FaceID Web Camera UI
        location /faceid/ {
            proxy_pass http://47.129.142.105:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 5. FaceID APIs (/api/register_ekyc, /api/verify_faceid, /api/wallets)
        location /api/ {
            proxy_pass http://47.129.142.105:5001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 6. Fraud Detection AI Service
        location /fraud/ {
            proxy_pass http://47.129.142.105:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Health endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
