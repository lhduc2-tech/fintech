---
# ============================================================
# DEPLOYMENT: notificationservice
# Kafka consumer, gui email, port 8084 (adjust neu khac)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificationservice-deployment
  namespace: fintech
  labels:
    app: notificationservice
    version: "v1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notificationservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notificationservice
        version: "v1.0"
    spec:
      containers:
        - name: notificationservice
          image: nigasante/notificationservice:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: SPRING_MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: SPRING_MAIL_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: KAFKA_PAYLOAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_PAYLOAD_SECRET_KEY
            - name: KAFKA_CA_CERT_PATH
              value: "/app/certs/ca.pem"
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /app/certs
              readOnly: true
          # Health probes tam thoi tat - bat lai sau khi them spring-boot-starter-actuator vao pom.xml
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-ca-cert

---
# ============================================================
# SERVICE: notificationservice
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: notificationservice-service
  namespace: fintech
  labels:
    app: notificationservice
spec:
  selector:
    app: notificationservice
  ports:
    - name: http
      protocol: TCP
      port: 8084
      targetPort: 8084
  type: ClusterIP
