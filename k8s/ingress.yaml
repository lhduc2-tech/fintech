---
# ============================================================
# INGRESS: Nginx Ingress Controller
# Expose tat ca services ra ngoai qua 1 IP duy nhat
#
# Prerequisites:
# kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
# Voi Minikube:
# minikube addons enable ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintech-ingress
  namespace: fintech
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    # ⚠️  Thay bang domain thuc te cua ban
    # Voi Minikube dung local: http://fintech.local
    # Them vao hosts file: <minikube-ip> fintech.local
    - host: fintech.local
      http:
        paths:
          # fintech-service: /fintech-service/**
          - path: /fintech-service
            pathType: Prefix
            backend:
              service:
                name: fintech-service
                port:
                  number: 8082
          # paymentgateway: /paymentgateway-service/**
          - path: /paymentgateway-service
            pathType: Prefix
            backend:
              service:
                name: paymentgateway-service
                port:
                  number: 8080
          # notificationservice: /notification-service/**
          - path: /notification-service
            pathType: Prefix
            backend:
              service:
                name: notificationservice-service
                port:
                  number: 8084
          # coreservice: /core-service/**
          # Note: thuong khong expose coreservice ra ngoai (internal only)
          # Chi them neu can debug hoac co API public
          - path: /core-service
            pathType: Prefix
            backend:
              service:
                name: coreservice-service
                port:
                  number: 8086
