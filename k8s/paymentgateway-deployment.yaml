---
# ============================================================
# DEPLOYMENT: paymentgateway
# Port 8080, phu thuoc vao coreservice-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentgateway-deployment
  namespace: fintech
  labels:
    app: paymentgateway
    version: "v1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paymentgateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: paymentgateway
        version: "v1.0"
    spec:
      containers:
        - name: paymentgateway
          image: nigasante/paymentgateway:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_CTX_PATH
              value: "/paymentgateway-service"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: KAFKA_PAYLOAD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fintech-secrets
                  key: KAFKA_PAYLOAD_SECRET_KEY
            # ca.pem duoc mount vao /app/certs/
            - name: KAFKA_CA_CERT_PATH
              value: "/app/certs/ca.pem"
            # ✅ Dung DNS noi bo K8s thay vi localhost
            # Format: http://<service-name>.<namespace>.svc.cluster.local:<port>
            # Hoac short form (cung namespace): http://<service-name>:<port>
            - name: CORE_SERVICE_URL
              value: "http://coreservice-service:8086"
          volumeMounts:
            - name: kafka-ca-cert
              mountPath: /app/certs
              readOnly: true
          # Health probes tam thoi tat - bat lai sau khi them spring-boot-starter-actuator vao pom.xml
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: kafka-ca-cert
          secret:
            secretName: kafka-ca-cert

---
# ============================================================
# SERVICE: paymentgateway
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: paymentgateway-service
  namespace: fintech
  labels:
    app: paymentgateway
spec:
  selector:
    app: paymentgateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
