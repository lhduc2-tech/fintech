services:

  fintech-service:
    image: nigasante/fintech-service:latest
    container_name: fintech-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_CTX_PATH: /fintech-service
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      KAFKA_PAYLOAD_SECRET_KEY: ${KAFKA_PAYLOAD_SECRET_KEY}
      KAFKA_CA_CERT_PATH: /app/certs/ca.pem
      REDIS_REST_URL: ${REDIS_REST_URL}
      REDIS_REST_TOKEN: ${REDIS_REST_TOKEN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_KEY_ID: ${S3_KEY_ID}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    volumes:
      - ./ca.pem:/app/certs/ca.pem:ro
    networks:
      - fintech-network

  paymentgateway:
    image: nigasante/paymentgateway:latest
    container_name: paymentgateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_CTX_PATH: /paymentgateway-service
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      KAFKA_PAYLOAD_SECRET_KEY: ${KAFKA_PAYLOAD_SECRET_KEY}
      KAFKA_CA_CERT_PATH: /app/certs/ca.pem
      # ✅ Gọi coreservice qua tên container (Docker network noi bo)
      CORE_SERVICE_URL: http://coreservice:8086
    volumes:
      - ./ca.pem:/app/certs/ca.pem:ro
    depends_on:
      - coreservice
    networks:
      - fintech-network

  coreservice:
    image: nigasante/coreservice:latest
    container_name: coreservice
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      KAFKA_PAYLOAD_SECRET_KEY: ${KAFKA_PAYLOAD_SECRET_KEY}
      KAFKA_CA_CERT_PATH: /app/certs/ca.pem
    volumes:
      - ./ca.pem:/app/certs/ca.pem:ro
    networks:
      - fintech-network

  notificationservice:
    image: nigasante/notificationservice:latest
    container_name: notificationservice
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      KAFKA_PAYLOAD_SECRET_KEY: ${KAFKA_PAYLOAD_SECRET_KEY}
      KAFKA_CA_CERT_PATH: /app/certs/ca.pem
    volumes:
      - ./ca.pem:/app/certs/ca.pem:ro
    networks:
      - fintech-network

networks:
  fintech-network:
    driver: bridge
